name: Mass-Market Deal Scraper
on:
  schedule:
    # 1. Run hourly at 6:00 AM and 7:00 AM IST (00:30 and 01:30 UTC)
    - cron: '30 0,1 * * *'
    
    # 2. Run at 8:00 AM and 8:15 AM IST (02:30 and 02:45 UTC)
    - cron: '30,45 2 * * *'
    
    # 3. Run every 15 minutes from 8:30 AM to 11:15 PM IST (03:00 to 17:45 UTC)
    - cron: '*/15 3-17 * * *'
    
    # 4. Run at 11:30 PM, 11:45 PM, and 12:00 AM Midnight IST (18:00, 18:15, 18:30 UTC)
    - cron: '0,15,30 18 * * *'

  workflow_dispatch:

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Restore seen deals cache
        uses: actions/cache@v4
        with:
          path: seen_deals.json
          key: ${{ runner.os }}-seen-deals-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-seen-deals-

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 playwright
          playwright install chromium

      - name: Run Deal Scraper
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CUELINKS_API_KEY: ${{ secrets.CUELINKS_API_KEY }}
          AMAZON_AFFILIATE_TAG: ${{ secrets.AMAZON_AFFILIATE_TAG }}
        run: python deal_scraper.py
