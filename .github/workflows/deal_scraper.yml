name: Mass-Market Deal Scraper

on:
  schedule:
    - cron: '30 0,1 * * *'
    - cron: '30,45 2 * * *'
    - cron: '*/15 3-17 * * *'
    - cron: '0,15,30 18 * * *'
  workflow_dispatch:

# CRITICAL LOCK: Never allow two runs (e.g. cron + manual run) to execute at the same time!
concurrency:
  group: deal-scraper-single-instance
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 playwright
          playwright install chromium --with-deps

      - name: Pull latest seen_deals.json before scanning
        run: |
          git pull origin main --rebase || true

      - name: Run Deal Scraper
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CUELINKS_API_KEY: ${{ secrets.CUELINKS_API_KEY }}
          AMAZON_AFFILIATE_TAG: ${{ secrets.AMAZON_AFFILIATE_TAG }}
        run: python deal_scraper.py

      - name: Commit and Push updated seen_deals.json
        if: always()
        run: |
          if [ -f seen_deals.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add seen_deals.json
            git diff --staged --quiet || (git commit -m "Update seen deals cache [skip ci]" && git pull --rebase origin main && git push origin main)
          fi
