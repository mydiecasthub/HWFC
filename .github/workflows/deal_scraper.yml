name: Mass-Market Deal Scraper

on:
  schedule:
    # Run every hour from 6:00 AM to 8:00 AM
    - cron: '0 6,7 * * *'
    
    # Run every 15 minutes from 8:00 AM to 11:59 PM (Midnight)
    - cron: '*/15 8-23 * * *'

  workflow_dispatch: # Allows manual trigger from Actions tab

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Restore seen deals cache
        uses: actions/cache@v4
        with:
          path: seen_deals.json
          key: ${{ runner.os }}-seen-deals-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-seen-deals-

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 playwright
          playwright install chromium

      - name: Run Deal Scraper
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CUELINKS_API_KEY: ${{ secrets.CUELINKS_API_KEY }}
          AMAZON_AFFILIATE_TAG: ${{ secrets.AMAZON_AFFILIATE_TAG }}
        run: python deal_scraper.py
