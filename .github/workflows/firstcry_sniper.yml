name: FirstCry Deal Sniper

on:
  workflow_dispatch:

concurrency:
  group: firstcry-sniper-group
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache Pip and Playwright Chromium
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/ms-playwright
          key: ${{ runner.os }}-pip-playwright-v3

      - name: Install dependencies & verify Playwright Chromium
        run: |
          pip install playwright requests beautifulsoup4 lxml
          playwright install chromium --with-deps

      - name: Run FirstCry Deal Scraper
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CUELINKS_API_KEY: ${{ secrets.CUELINKS_API_KEY }}
        run: python deal_scraper.py

      - name: Save and Commit seen_deals.json Cache
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_deals.json
          if ! git diff --cached --quiet; then
            git commit -m "Update seen_deals.json cache [skip ci]"
            git pull --rebase origin main
            git push origin main
          else
            echo "No new deals to update in cache."
          fi
