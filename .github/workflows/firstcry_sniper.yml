name: FirstCry Deal Sniper

on:
  schedule:
    # Runs from 8:00 AM IST (02:30 UTC) to 00:00 AM IST (18:30 UTC)
    - cron: '30,40,50 2 * * *'
    - cron: '15,30,45 3-17 * * *'
    - cron: '0,10,20,30 18 * * *'
  workflow_dispatch:

concurrency:
  group: firstcry-sniper-group
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache Playwright and Pip packages
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.cache/pip
          key: ${{ runner.os }}-playwright-fc-v1

      - name: Install dependencies
        run: |
          pip install playwright requests beautifulsoup4
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" != "true" ]; then
            playwright install chromium --with-deps
          else
            playwright install-deps chromium
          fi

      - name: Run FirstCry Deal Scraper
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CUELINKS_API_KEY: ${{ secrets.CUELINKS_API_KEY }}
        run: python deal_scraper.py

      - name: Commit and push updated seen_deals.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_deals.json
          git diff --staged --quiet || (git commit -m "Update seen_deals.json cache [skip ci]" && git pull --rebase origin main && git push)
