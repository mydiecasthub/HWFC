name: FirstCry Deal Sniper

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache Pip and Playwright Chromium
        id: deps-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/ms-playwright
          key: ${{ runner.os }}-ubuntu24-py311-playwright-v1

      - name: Install Python dependencies
        run: |
          pip install playwright requests beautifulsoup4 lxml

      - name: Install Playwright Chromium (only on cache miss)
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: playwright install chromium

      - name: Run FirstCry Deal Scraper
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CUELINKS_API_KEY: ${{ secrets.CUELINKS_API_KEY }}
        run: python deal_scraper.py

      - name: Save and Commit seen_deals.json Cache
        if: always()
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          if [ -f seen_deals.json ]; then
            git add seen_deals.json
            git diff --staged --quiet || (git pull --rebase origin main && git commit -m "Update seen_deals.json cache [skip ci]" && git push)
          fi
